<html>
<head>
    <title>Bai 4</title>
</head>
<body>
    <h1>Form tao thong tin</h1>
    <form>
        <!-- Input neu khong truyen type thi
        type se mac dinh la text -->
        <div>
             <p><b>Ho va Ten</b></p> 
             <input type="text" name="hoVaTen">
        </div>
        <div>
            <p><b>Gioi thieu</b></p> 
            <textarea name="gioithieu"></textarea>
        </div>
        <div>
            <p><b>Email</b></p> 
            <input type="email" name="email">
        </div>
        <div>
            <p><b>So dien thoai</b></p> 
            <input name="soDienThoai"
            type="tel"
            placeholder="Dang so 123"
            required
            pattern="([0]{1}([9,3,6,8]{1})([0-9]{8}))">
        </div>
        <div>
            <p><b>Gioi tinh</b></p>
            <input type="radio" name="gioiTinh" value="nam">Nam<br>
            <input type="radio" name="gioiTinh" value="nu">Nu
        </div>
         <div>
            <p><b>So Thich</b></p>
            Game:<input type="checkbox" name="soThich" value="game"><br>
            Music:<input type="checkbox" name="soThich" value="music"><br>
            Sport:<input type="checkbox" name="soThich" value="sport"><br>
        </div>
        <div>
            <p><b>Trinh duyet web hay su dung</b></p>
            <input list="browers">
             <datalist id="browers">
                <option value="Internet Explorer">
                <option value="Filefox">  
                <option value="Chrome">
                <option value="Opera">
             </datalist>
            <select name="browsers">
                <option value="Internet Explorer">Internet Explorer</option>
                <option value="Filefox">Filefox</option> 
                <option value="Chrome">Chrome</option>
                <option value="Opera">Opera</option>
                <option value="Safari">Safari</option>
                <option value="Coc coc">Coc coc</option>
            </select>
        </div>
        <div>
            0 <input type="range" id="a" value="50"> 100
        </div>
        <div>
            <input type="submit">
            <button>click</button>
            <input type="reset">
        </div>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/hvEKIKIjkuY?si=kw6e1aD-knzWchuL" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    </form>
    <MARQUEE>
        <img src="/anh/meme.jpg"
    </MARQUEE>

    <audio controls>
        <source src="/anh/nhac.mp3" type="audio/mp3">
    </audio>
    <video controls>
        <source src="/anh/video.mp4" type="video/mp4">
    </video>
</body>
</html>
